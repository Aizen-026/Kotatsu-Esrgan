name: Build Kotatsu AI
on:
  workflow_dispatch:
  push:
    branches: [ devel ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Inject AI Engine & Models
        run: |
          mkdir -p app/src/main/assets/ai_engine
          mkdir -p app/src/main/jniLibs/arm64-v8a
          
          # 1. Download Android ARM64 Engine from Tumuyan (BigImage creator)
          echo "Downloading Android AI Engine..."
          curl -L "https://github.com/tumuyan/RealSR-NCNN-Android/releases/download/1.11.1/assets.zip" -o android_assets.zip
          unzip -q android_assets.zip -d android_temp
          
          # Move the engine executable and its required libraries
          cp android_temp/realsr/realsr-ncnn app/src/main/assets/ai_engine/
          cp android_temp/realsr/libomp.so app/src/main/jniLibs/arm64-v8a/ 2>/dev/null || true
          cp android_temp/realsr/libc++_shared.so app/src/main/jniLibs/arm64-v8a/ 2>/dev/null || true
          
          # 2. Download the AnimeVideoV3 (esrganv3x2) models
          # We pull this from the Ubuntu release because the models themselves are universal
          echo "Downloading esrganv3x2 models..."
          curl -L "https://github.com/xinntao/Real-ESRGAN-ncnn-vulkan/releases/download/v0.2.0/realesrgan-ncnn-vulkan-20220424-ubuntu.zip" -o ubuntu_release.zip
          unzip -q ubuntu_release.zip -d ubuntu_temp
          
          # Move the exact models you wanted into the app
          cp ubuntu_temp/models/realesr-animevideov3-x2.bin app/src/main/assets/ai_engine/
          cp ubuntu_temp/models/realesr-animevideov3-x2.param app/src/main/assets/ai_engine/
          
          # Clean up
          rm -rf android_assets.zip android_temp ubuntu_release.zip ubuntu_temp
          echo "AI Engine injected successfully!"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kotatsu-AI-Ultimate
          path: app/build/outputs/apk/debug/*.apk
