name: Build Kotatsu AI Ultimate
on:
  workflow_dispatch:
  push:
    branches: [ devel ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Inject All AI Engines & Models
        run: |
          mkdir -p app/src/main/assets/ai_engine/models
          mkdir -p app/src/main/jniLibs/arm64-v8a
          
          # 1. Real-ESRGAN Engine & Models
          echo "Fetching Real-ESRGAN..."
          curl -L "https://github.com/tumuyan/RealSR-NCNN-Android/releases/download/1.11.1/assets.zip" -o esrgan_android.zip
          unzip -q esrgan_android.zip -d esrgan_temp
          find esrgan_temp -name "realsr-ncnn" -exec cp {} app/src/main/jniLibs/arm64-v8a/lib_realesrgan.so \;
          
          curl -L "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-ubuntu.zip" -o esrgan_models.zip
          unzip -q esrgan_models.zip -d esrgan_models_temp
          find esrgan_models_temp -name "realesr-animevideov3-x2.bin" -exec cp {} app/src/main/assets/ai_engine/models/ \;
          find esrgan_models_temp -name "realesr-animevideov3-x2.param" -exec cp {} app/src/main/assets/ai_engine/models/ \;
          
          # 2. Waifu2x Engine & Models
          echo "Fetching Waifu2x..."
          curl -L "https://github.com/nihui/waifu2x-ncnn-vulkan/releases/download/20220728/waifu2x-ncnn-vulkan-20220728-ubuntu.zip" -o waifu2x_ubuntu.zip
          unzip -q waifu2x_ubuntu.zip -d waifu2x_temp
          
          # Android version of Waifu2x CLI from tumuyan
          curl -L "https://github.com/tumuyan/waifu2x-ncnn-vulkan-android/releases/download/1.2.0/assets.zip" -o waifu_android.zip
          unzip -q waifu_android.zip -d waifu_android_temp
          find waifu_android_temp -name "waifu2x-ncnn" -exec cp {} app/src/main/jniLibs/arm64-v8a/lib_waifu2x.so \;
          
          # Copy Waifu2x models (CUnet and Anime Style Art)
          cp -r waifu2x_temp/*/models-cunet app/src/main/assets/ai_engine/models/
          cp -r waifu2x_temp/*/models-upconv_7_anime_style_art_rgb app/src/main/assets/ai_engine/models/
          
          # Clean up
          rm -rf *temp *.zip
          echo "All Engines & Models injected successfully!"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kotatsu-AI-Ultimate-Arsenal
          path: app/build/outputs/apk/debug/*.apk
