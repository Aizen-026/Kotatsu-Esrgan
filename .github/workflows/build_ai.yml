name: Build Kotatsu AI
on:
  workflow_dispatch:
  push:
    branches: [ devel ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Inject AI Engine & Models
        run: |
          mkdir -p app/src/main/assets/ai_engine
          mkdir -p app/src/main/jniLibs/arm64-v8a
          
          # 1. Download Android ARM64 Engine from Tumuyan
          echo "Downloading Android AI Engine..."
          curl -L "https://github.com/tumuyan/RealSR-NCNN-Android/releases/download/1.11.1/assets.zip" -o android_assets.zip
          unzip -q android_assets.zip -d android_temp
          
          # Use 'find' to locate the files, no matter what folder they extracted into
          find android_temp -name "realsr-ncnn" -exec cp {} app/src/main/assets/ai_engine/ \;
          find android_temp -name "libomp.so" -exec cp {} app/src/main/jniLibs/arm64-v8a/ \;
          find android_temp -name "libc++_shared.so" -exec cp {} app/src/main/jniLibs/arm64-v8a/ \;
          
          # 2. Download the AnimeVideoV3 models
          echo "Downloading esrganv3x2 models..."
          curl -L "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-ubuntu.zip" -o ubuntu_release.zip
          unzip -q ubuntu_release.zip -d ubuntu_temp
          
          # Find and move the specific models we need
          find ubuntu_temp -name "realesr-animevideov3-x2.bin" -exec cp {} app/src/main/assets/ai_engine/ \;
          find ubuntu_temp -name "realesr-animevideov3-x2.param" -exec cp {} app/src/main/assets/ai_engine/ \;
          
          # Clean up
          rm -rf android_assets.zip android_temp ubuntu_release.zip ubuntu_temp
          echo "AI Engine injected successfully!"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kotatsu-AI-Ultimate
          path: app/build/outputs/apk/debug/*.apk
