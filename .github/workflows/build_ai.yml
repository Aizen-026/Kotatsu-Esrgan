name: Build Kotatsu AI
on:
  workflow_dispatch:
  push:
    branches: [ devel ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Inject AI Engine & Models
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/assets/models
          
          # Using curl with -L to follow redirects and -o to ensure a real zip file
          echo "Downloading AI Engine..."
          curl -L "https://github.com/xinntao/Real-ESRGAN-ncnn-vulkan/releases/download/v0.2.0/realesrgan-ncnn-vulkan-20220424-android.zip" -o esrgan.zip
          
          # Check if the file is a valid zip before proceeding
          if unzip -t esrgan.zip; then
            unzip -q esrgan.zip -d esrgan_temp
            cp esrgan_temp/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
            cp esrgan_temp/models/realesr-animevideov3-x2.* app/src/main/assets/models/
            echo "AI Engine injected successfully!"
          else
            echo "Error: Downloaded file is corrupted or blocked. Build will likely fail."
            exit 1
          fi
          
          rm -rf esrgan_temp esrgan.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kotatsu-AI-Ultimate
          path: app/build/outputs/apk/debug/*.apk
