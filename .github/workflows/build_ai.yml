name: Build Kotatsu AI
on:
  workflow_dispatch:
  push:
    branches: [ devel ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Inject AI Engine & Models
        run: |
          # 1. Download the Real-ESRGAN Android binaries & JNI
          curl -L https://github.com/xinntao/Real-ESRGAN-ncnn-vulkan/releases/download/v0.2.0/realesrgan-ncnn-vulkan-20220424-android.zip -o esrgan.zip
          unzip esrgan.zip -d esrgan_temp
          
          # 2. Move Models to Assets
          mkdir -p app/src/main/assets/models
          cp -r esrgan_temp/models/* app/src/main/assets/models/
          
          # 3. Clean up
          rm -rf esrgan_temp esrgan.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kotatsu-AI-Ultimate
          path: app/build/outputs/apk/debug/*.apk
