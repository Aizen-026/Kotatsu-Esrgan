      -       - name: Inject AI Engine & Models
        run: |
          # Create directories
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/assets/models
          
          # Download the Real-ESRGAN NCNN Android Libs (Stable Mirror)
          wget https://github.com/xinntao/Real-ESRGAN-ncnn-vulkan/releases/download/v0.2.0/realesrgan-ncnn-vulkan-20220424-android.zip
          unzip realesrgan-ncnn-vulkan-20220424-android.zip -d esrgan_temp
          
          # Move the library files (.so) for Snapdragon (arm64-v8a)
          cp esrgan_temp/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          
          # Move the models (esrgan-animevideov3-x2)
          cp esrgan_temp/models/realesr-animevideov3-x2.* app/src/main/assets/models/
          
          # Clean up
          rm -rf esrgan_temp *.zip
